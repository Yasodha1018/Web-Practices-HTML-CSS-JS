<!DOCTYPE html> 
<html lang="en"> 
    <head>    
        <meta charset="UTF-8">    
        <title>Button Click Events</title>    
        <link rel="stylesheet" href="style.css"> 
    </head> 
    <body>    
        <div class="counter-card">        
            <h2>Click Counter</h2>        
            <p class="count-display">Count: <span id="count">0</span></p>        
            <div class="btn-group">            
                <button id="incrementBtn" class="btn inc">+ Increment</button>            
                <button id="decrementBtn" class="btn dec">&minus; Decrement</button>            
                <button id="resetBtn" class="btn reset">Reset</button>        
            </div>        
            <p id="status">Status: Ready</p>    
        </div>    
        <script src="script.js"></script> 
    </body> 
    </html>
